# The toy lead graph (spec §4.2 in small): stages that hand back typed documents from scratch workspaces, Odin
# publishing them and their views after the approval points, the plan read into tasks, the leaves created, and then a
# task shape that repeats for every task, in the leaf and the realm the task names.
name: midgard-toy
version: 0.1.0
schema: 2
nodes:
  - { id: design, kind: agent, role: planner, prompt: prompts/design.md, scratch: true, input: [rejection], output: ygg.design/v1 }
  - { id: design-gate, kind: gate, gate: design }
  - { id: design-docs, kind: publish, from: design, to: docs }
  - { id: spec, kind: agent, role: planner, prompt: prompts/spec.md, scratch: true, input: [design, decisions, rejection, refusal], output: ygg.spec/v1 }
  - { id: spec-gate, kind: gate, gate: spec }
  - { id: spec-docs, kind: publish, from: spec, to: docs }
  - { id: plan, kind: agent, role: planner, prompt: prompts/plan.md, scratch: true, input: [rejection, refusal], output: ygg.plan/v1 }
  - { id: plan-docs, kind: publish, from: plan, to: docs }
  - { id: ready, kind: tasks, from: plan, leaves: docs/leaves.yaml, back_to: plan }
  - { id: leaves, kind: init, from: docs/leaves.yaml }
  - { id: plan-gate, kind: gate, gate: plan, reruns: plan }
  - id: tasks
    kind: foreach
    over: tasks
    nodes:
      - { id: implement, kind: loop, realm: leaf, role: implementer, attempts: 2, input: [rejection, refusal], output: ygg.implement/v1 }
      - { id: feature-gate, kind: gate, gate: feature }
      - { id: land, kind: merge, realm: leaf, back_to: implement }
      - { id: move, kind: pointer, realm: leaf, acceptance: [accept], back_to: implement }
