# The scripted agent's answers for the toy graph. spec has a second attempt for a rejection.
steps:
  design:
    - actions: [ { write: { path: design.md, content: "# Design\n" } } ]
      result: { status: ok, summary: wrote design.md, usage: { in: 1000, out: 100, turns: 2 }, output: '{"summary": "done"}' }
  spec:
    - actions: [ { write: { path: spec.md, content: "# Spec\n" } } ]
      result: { status: ok, summary: wrote spec.md, usage: { in: 1000, out: 100, turns: 2 }, output: '{"summary": "done"}' }
    - actions: [ { write: { path: spec.md, content: "# Spec\n\nUsers: photographers and their clients.\n" } } ]
      result: { status: ok, summary: named the users in spec.md, usage: { in: 1000, out: 100, turns: 2 }, output: '{"summary": "done"}' }
  plan:
    - actions: [ { write: { path: plan.md, content: "# Plan\n" } } ]
      result: { status: ok, summary: wrote plan.md, usage: { in: 1000, out: 100, turns: 2 }, output: '{"title": "Plan", "slug": "plan", "goal": "The plan of the test.", "decisions": [], "risks": [], "tasks": [{"id": "plan-T001", "title": "Task one", "criteria": ["It works.", "It is tested."], "named_test": "app_test.go:TestOne", "layer": "repos/app", "size": "S", "depends_on": [], "text": "The task of the test."}]}' }
  build:
    - actions: [ { write: { path: build.txt, content: "done\n" } } ]
      result: { status: ok, summary: built it, usage: { in: 2000, out: 400, cache: 1500, turns: 5 }, output: '{"summary": "done"}' }
