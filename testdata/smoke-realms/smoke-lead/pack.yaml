# The graph pack and a leaf realm of the realms smoke run: real planners hand back the spec, with its leaves, and the
# plan from scratch workspaces, Odin publishes them, writes the leaves file and creates the leaves, and a real implementer builds one small task in
# each leaf. It costs a few cents. The prompts ask for exact documents: this run tests the machinery, not the
# planner's judgment.
name: smoke-lead
version: 0.1.0
graph: graph.yaml
checks:
  unit: [grep, -q, hello, hello.txt]
leaf:
  description: A smoke leaf of this realm.
  template: templates/leaf
  first_commit: [LICENSE]
  implementer: prompts/implementer.md
  checks: [unit]
sandbox:
  stack: docker.io/library/golang:1.26.7-bookworm@sha256:e8c859f5632dcfde7b32d2012b4351728f6437930887c2f6a91ea242459e5514
  egress: []
