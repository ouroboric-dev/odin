# The scripted agents' answers for the content smoke run (v0-H15): a one-feature brief (the gallery's
# version) built in two leaves, with real code and real tests, so that every rung of the realms' check ladders
# and the acceptance run have something real to judge. Every stage answers with its typed contract (change
# typed-boundaries): the planners' documents, the reviews and the implementers' summaries are each session's whole
# final answer, which Odin validates, keeps and publishes; the implementers also write what a real implementer
# would, with the commands a real one would run. The run is given brief.md (ygg-smoke-realms.sh --brief).
steps:
  design:
    - result:
        status: ok
        summary: wrote the design
        usage: { in: 1000, out: 100, turns: 2 }
        output: |
          {"title": "Gallery version", "slug": "version",
           "summary": "The gallery tells anyone who asks which version is running, and its web page shows it.",
           "goals": "A person or a program can ask the server its version; the home page shows it.",
           "non_goals": "No login, no galleries, no other pages.",
           "success_criteria": "GET /version answers the version, and the home page shows API version: 0.1.0.",
           "context": "The gallery has an API and a web app; the web app already shows whether the API is up.",
           "product_at_user_level": "A person opens the home page and reads the version of the API below the health line.",
           "decisions": [], "open_questions": []}
  spec:
    - result:
        status: ok
        summary: wrote the spec and named the leaves
        usage: { in: 1000, out: 100, turns: 2 }
        output: |
          {"title": "Gallery version", "slug": "version",
           "summary": "GET /version answers {\"version\": \"0.1.0\"}; the home page shows API version: 0.1.0.",
           "architecture": "repos/api serves /version; repos/web reads it through its generated API client.",
           "interfaces": "GET /version answers 200 with {\"version\": string}; any other method answers 405.",
           "data_model": "None: the version is a constant of the API.",
           "acceptance_criteria": "GET /version answers 200 with the JSON {\"version\": \"0.1.0\"}; the home page shows API version: 0.1.0 below the health line.",
           "security": "The route reads nothing and needs no login.",
           "testing": "A Go test of the handler, a component test of the badge, and the end-to-end smoke test.",
           "decisions": [], "deviations": [],
           "leaves": {"runtime": {"realm": "niflheim-local", "realm_version": "0.1.0"},
                      "leaves": {"repos/api": {"realm": "helheim-go", "realm_version": "0.1.0", "description": "The gallery's API."},
                                 "repos/web": {"realm": "midgard-react", "realm_version": "0.1.0", "description": "The gallery's web app.", "consumes": ["repos/api"]}}}}
  conformance:
    - result: { status: ok, summary: the spec stays inside the design, usage: { in: 500, out: 50, turns: 1 }, output: '{"deviation": false}' }
  plan:
    - result:
        status: ok
        summary: wrote the plan
        usage: { in: 1000, out: 100, turns: 2 }
        output: |
          {"title": "Gallery version", "slug": "version", "goal": "The API says its version and the home page shows it.",
           "decisions": [], "risks": [],
           "tasks": [
            {"id": "version-T001", "title": "The API says its version",
             "criteria": ["GET /version answers 200 with the JSON {\"version\": \"0.1.0\"}.", "Any other method on /version answers 405.", "openapi.yaml describes /version."],
             "named_test": "internal/httpapi/version_test.go TestVersionIsServed", "layer": "repos/api", "size": "S", "depends_on": [],
             "text": "Add the route GET /version to the API. It answers 200 with the JSON {\"version\": \"0.1.0\"}; any other method answers 405. Describe it in openapi.yaml.",
             "contract": "openapi: 3.1.0\ninfo: { title: Gallery API, version: 0.1.0 }\npaths:\n  /version:\n    get:\n      operationId: getVersion\n      responses:\n        \"200\":\n          description: The server's version.\n"},
            {"id": "version-T002", "title": "The home page shows the version",
             "criteria": ["The home page shows API version: 0.1.0 below the health line.", "The web app's copy of the contract has /version, exactly as the API describes it."],
             "named_test": "src/version.test.tsx", "layer": "repos/web", "size": "S", "depends_on": ["version-T001"],
             "text": "Show the line API version: 0.1.0 on the home page, below the health line, read from GET /version. Copy /version into contracts/api.openapi.yaml as the API describes it.",
             "contract": "openapi: 3.1.0\ninfo: { title: Gallery API, version: 0.1.0 }\npaths:\n  /version:\n    get:\n      operationId: getVersion\n      responses:\n        \"200\":\n          description: The server's version.\n"}]}
  reuse-review:
    - result: { status: ok, summary: nothing to remove, usage: { in: 500, out: 50, turns: 1 }, output: '{"verdict": "Nothing to remove.", "items": []}' }
  version-t001-implement:
    - actions:
        - write:
            path: internal/httpapi/version_test.go
            content: |
              package httpapi

              import (
              	"encoding/json"
              	"net/http"
              	"net/http/httptest"
              	"testing"
              )

              func TestVersionIsServed(t *testing.T) {
              	rec := httptest.NewRecorder()
              	New(Deps{}).ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/version", nil))
              	if rec.Code != http.StatusOK {
              		t.Fatalf("GET /version = %d, want 200", rec.Code)
              	}
              	var body map[string]string
              	if err := json.Unmarshal(rec.Body.Bytes(), &body); err != nil || body["version"] != "0.1.0" {
              		t.Errorf("body = %s, %v; want {\"version\":\"0.1.0\"}", rec.Body.String(), err)
              	}
              }

              func TestOnlyGetReachesVersion(t *testing.T) {
              	rec := httptest.NewRecorder()
              	New(Deps{}).ServeHTTP(rec, httptest.NewRequest(http.MethodPost, "/version", nil))
              	if rec.Code != http.StatusMethodNotAllowed {
              		t.Errorf("POST /version = %d, want 405", rec.Code)
              	}
              }
        - write:
            path: internal/httpapi/version.go
            content: |
              package httpapi

              import "net/http"

              // version is the API's version, as /version reports it.
              const version = "0.1.0"

              func versionHandler(w http.ResponseWriter, _ *http.Request) {
              	writeJSON(w, http.StatusOK, map[string]string{"version": version})
              }
        - run:
            argv:
              - sed
              - -i
              - 's|^\tmux.HandleFunc("/", notFound)|\tmux.HandleFunc("/version", only(http.MethodGet, versionHandler))\n&|'
              - internal/httpapi/server.go
        - run:
            argv:
              - sh
              - -c
              - |
                cat >> openapi.yaml <<'EOF'
                  /version:
                    get:
                      operationId: getVersion
                      summary: Which version the server is
                      responses:
                        "200":
                          description: The server's version.
                          content:
                            application/json:
                              schema:
                                type: object
                                required: [version]
                                properties:
                                  version:
                                    type: string
                                    example: "0.1.0"
                EOF
      result: { status: ok, summary: the API serves its version, usage: { in: 2000, out: 200, turns: 4 }, output: '{"summary": "done"}' }
  version-t002-implement:
    - actions:
        - write:
            path: src/version.test.tsx
            content: |
              import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
              import { render, screen } from "@testing-library/react";
              import { describe, expect, it, vi } from "vitest";
              import { VersionBadge } from "@/components/version-badge";

              function renderBadge() {
                const client = new QueryClient({ defaultOptions: { queries: { retry: false } } });
                return render(
                  <QueryClientProvider client={client}>
                    <VersionBadge />
                  </QueryClientProvider>,
                );
              }

              describe("VersionBadge", () => {
                it("shows the version the API reports", async () => {
                  vi.stubGlobal(
                    "fetch",
                    vi.fn(async () => new Response(JSON.stringify({ version: "0.1.0" }), { status: 200, headers: { "Content-Type": "application/json" } })),
                  );
                  renderBadge();
                  expect(await screen.findByText("API version: 0.1.0")).toBeInTheDocument();
                });
              });
        - write:
            path: src/components/version-badge.tsx
            content: |
              import { useQuery } from "@tanstack/react-query";
              import { api } from "@/lib/api";

              /** The API's version, as /version says it. */
              async function readVersion(): Promise<string> {
                const { data } = await api.GET("/version");
                if (!data) throw new Error("the API did not say its version");
                return data.version;
              }

              export function VersionBadge() {
                const version = useQuery({ queryKey: ["version"], queryFn: readVersion });
                if (!version.data) return null;
                return <p className="text-sm text-neutral-600">API version: {version.data}</p>;
              }
        - run:
            argv:
              - sed
              - -i
              - -e
              - 's|^import { HealthBadge } from "@/components/health-badge";|&\nimport { VersionBadge } from "@/components/version-badge";|'
              - -e
              - 's|^      <HealthBadge />|&\n      <VersionBadge />|'
              - src/routes/index.tsx
        - run:
            argv:
              - sh
              - -c
              - |
                cat >> contracts/api.openapi.yaml <<'EOF'
                  /version:
                    get:
                      operationId: getVersion
                      summary: Which version the server is
                      responses:
                        "200":
                          description: The server's version.
                          content:
                            application/json:
                              schema:
                                type: object
                                required: [version]
                                properties:
                                  version:
                                    type: string
                                    example: "0.1.0"
                EOF
        - run: { argv: [npm, ci, --no-audit, --no-fund] }
        - run: { argv: [npm, run, gen:api] }
        - run:
            argv:
              - sh
              - -c
              - |
                cat >> e2e/smoke.spec.ts <<'EOF'

                test("the home page shows the API's version", async ({ page }) => {
                  await page.goto("/");
                  await expect(page.getByText("API version: 0.1.0")).toBeVisible();
                });
                EOF
      result: { status: ok, summary: the home page shows the version, usage: { in: 2000, out: 200, turns: 4 }, output: '{"summary": "done"}' }
  version-t001-implement-spec-compliance:
    - result: { status: ok, output: '{"findings": []}' }
  version-t001-implement-simplicity:
    - result: { status: ok, output: '{"findings": []}' }
  version-t001-implement-quality:
    - result: { status: ok, output: '{"findings": []}' }
  version-t002-implement-spec-compliance:
    - result: { status: ok, output: '{"findings": []}' }
  version-t002-implement-simplicity:
    - result: { status: ok, output: '{"findings": []}' }
  version-t002-implement-quality:
    - result: { status: ok, output: '{"findings": []}' }
