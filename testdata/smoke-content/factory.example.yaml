# An example factory.yaml for the content smoke run (v0-H15): the real software graph pack of Voluspa and the
# real midgard-react and helheim-go realms, built with scripted agents on a real container engine. The agents
# cost nothing: they answer from script.yaml, and every command the realms run (the check ladder, the
# services, the acceptance run) is real. Copy it, set the engine, the mounts, the realm folder and the graph
# folder for your machine (`ygg run --graph software` finds the pack in graphs.dir; each leaf's realm comes
# from the realm store). The factory ships no defaults for the caps. The run needs its brief: ygg-smoke-realms.sh
# --graph software --brief /home/OPERATOR/yggdrasil/odin/testdata/smoke-content/brief.md --tag h15.
mode: unattended
privacy: strict
gates:
  design: auto
roles:
  planner: { agent: scripted, model: none, script: /home/OPERATOR/yggdrasil/odin/testdata/smoke-content/script.yaml }
  implementer: { agent: scripted, model: none, script: /home/OPERATOR/yggdrasil/odin/testdata/smoke-content/script.yaml }
  reviewer: { agent: scripted, model: none, script: /home/OPERATOR/yggdrasil/odin/testdata/smoke-content/script.yaml }
budget:
  per_run: { tokens: 1000000, turns: 1000 }
  per_day: { tokens: 2000000, turns: 2000 }
sandbox:
  engine: unix:///mnt/wsl/podman-sockets/podman-machine-default/podman-user.sock
  mounts:
    - { host: /home/OPERATOR/ygg, engine: /mnt/wsl/ygg-bind }
realms:
  dir: /home/OPERATOR/yggdrasil
graphs:
  dir: /home/OPERATOR/yggdrasil/voluspa
