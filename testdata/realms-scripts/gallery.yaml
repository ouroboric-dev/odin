# The scripted agent's answers for the toy realms' graph: the typed outputs of the three stages, then the four
# tasks. The spec names two leaves, an API from helheim-toy and a web leaf from midgard-toy that consumes it, and
# the plan four tasks over them. Odin publishes each output and its view, and writes docs/leaves.yaml from the
# spec's leaves.
steps:
  design:
    - result: { status: ok, summary: wrote the design, usage: { in: 1000, out: 100, turns: 2 }, output: '{"title": "Gallery", "slug": "gallery", "summary": "A gallery for photographers.", "goals": "A photographer shows galleries of photos.", "non_goals": "No editing.", "success_criteria": "A client sees the galleries.", "context": "Photographers and their clients.", "product_at_user_level": "A photographer makes a gallery; a client looks at it.", "decisions": [], "open_questions": []}' }
  spec:
    - result: { status: ok, summary: wrote the spec and named the leaves, usage: { in: 1000, out: 100, turns: 2 }, output: '{"title": "Gallery", "slug": "gallery", "summary": "An API and a web app.", "architecture": "Two leaves: repos/api and repos/web.", "interfaces": "The API stores and lists galleries.", "data_model": "A gallery has a name and photos.", "acceptance_criteria": "A gallery can be created and listed.", "security": "A client sees only its own galleries.", "testing": "Each leaf has its tests.", "decisions": [], "deviations": [], "leaves": {"leaves": {"repos/api": {"realm": "helheim-toy", "realm_version": "0.1.0", "description": "The gallery API."}, "repos/web": {"realm": "midgard-toy", "realm_version": "0.1.0", "description": "The gallery web app.", "consumes": ["repos/api"]}}}}' }
  plan:
    # The first plan has a task in a leaf the spec did not name; the plan check sends it back.
    - result: { status: ok, summary: wrote a plan with a mistake, usage: { in: 1000, out: 100, turns: 2 }, output: '{"title": "Gallery", "slug": "gallery", "goal": "A gallery for photographers.", "decisions": [], "risks": [], "tasks": [{"id": "gallery-T001", "title": "the API stores galleries", "criteria": ["a gallery can be created", "a created gallery can be read"], "named_test": "TestCreateGallery", "layer": "repos/api", "size": "S", "depends_on": [], "text": "Build the API stores galleries."}, {"id": "gallery-T002", "title": "the web app shows them", "criteria": ["the page lists galleries", "an empty list says so"], "named_test": "gallery.spec.ts", "layer": "repos/db", "size": "M", "depends_on": ["gallery-T001"], "text": "Build the web app shows them."}]}' }
    - result: { status: ok, summary: wrote the plan, usage: { in: 1000, out: 100, turns: 2 }, output: '{"title": "Gallery", "slug": "gallery", "goal": "A gallery for photographers.", "decisions": [], "risks": [], "tasks": [{"id": "gallery-T001", "title": "the API stores galleries", "criteria": ["a gallery can be created", "a created gallery can be read"], "named_test": "TestCreateGallery", "layer": "repos/api", "size": "S", "depends_on": [], "text": "Build the API stores galleries."}, {"id": "gallery-T002", "title": "the web app shows them", "criteria": ["the page lists galleries", "an empty list says so"], "named_test": "gallery.spec.ts", "layer": "repos/web", "size": "M", "depends_on": ["gallery-T001"], "text": "Build the web app shows them."}, {"id": "gallery-T003", "title": "the API lists the galleries of a client only", "criteria": ["the galleries of another client are never listed", "a client with none gets an empty list"], "named_test": "TestListsOnlyOwn", "layer": "repos/api", "size": "S", "depends_on": ["gallery-T001"], "text": "Build the API lists the galleries of a client only."}, {"id": "gallery-T004", "title": "the web app shows the photos of a gallery", "criteria": ["the page shows the photos", "a gallery with none says so"], "named_test": "photos.spec.ts", "layer": "repos/web", "size": "S", "depends_on": ["gallery-T002"], "text": "Build the web app shows the photos of a gallery."}]}' }
  gallery-t001-implement:
    - actions: [ { write: { path: api.txt, content: "done\n" } } ]
      result: { status: ok, summary: built the API's galleries, usage: { in: 2000, out: 200, turns: 4 }, output: '{"summary": "done"}' }
  gallery-t002-implement:
    - actions: [ { write: { path: web.txt, content: "done\n" } } ]
      result: { status: ok, summary: built the page, usage: { in: 2000, out: 200, turns: 4 }, output: '{"summary": "done"}' }
  gallery-t003-implement:
    - actions: [ { write: { path: api-own.txt, content: "done\n" } } ]
      result: { status: ok, summary: built the listing, usage: { in: 2000, out: 200, turns: 4 }, output: '{"summary": "done"}' }
  gallery-t004-implement:
    - actions: [ { write: { path: photos.txt, content: "done\n" } } ]
      result: { status: ok, summary: built the photos, usage: { in: 2000, out: 200, turns: 4 }, output: '{"summary": "done"}' }
