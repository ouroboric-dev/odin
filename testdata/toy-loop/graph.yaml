# The toy loop graph: an implementer, a check and two reviewers in a bounded loop, then a gate and the
# merge. Its sessions work in one leaf, repos/app, which the realm creates when a project lacks it.
name: toy-loop
version: 1.0.0
schema: 2
nodes:
  - id: build
    kind: loop
    input: [rejection, refusal, open_findings, check_results]
    output: ygg.implement/v1
    repo: repos/app
    role: implementer
    prompt: prompts/build.md
    attempts: 3
    checks: [unit]
    reviewers:
      - { id: spec, role: reviewer, prompt: prompts/review-spec.md, input: [change, open_findings, check_results], output: ygg.review/v1 }
      - { id: quality, role: reviewer, prompt: prompts/review-quality.md, input: [change, open_findings, check_results], output: ygg.review/v1 }
  - { id: feature-gate, kind: gate, gate: feature }
  - { id: merge, kind: merge, repo: repos/app, checks: [unit] }
